name: Publish GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Enable pnpm
        run: corepack enable
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Build website
        run: pnpm exec vite build --base=/game-design-portfolio/
      - name: Prepare static Pages files
        run: |
          rm -f dist/media/dark-tower-main-demo.mp4
          rm -f dist/media/roguelike-cursed-upgrade-demo.mp4
          rm -f dist/media/roguelike-full-gameplay-demo.mp4
          for route in dark-tower roguelike unity-ui vampire-survivors; do
            mkdir -p "dist/projects/$route"
            cp dist/index.html "dist/projects/$route/index.html"
          done
          touch dist/.nojekyll
      - name: Publish gh-pages branch
        run: |
          publish_dir="$(mktemp -d)"
          cp -R dist/. "$publish_dir"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin gh-pages:gh-pages --depth=1
          git switch gh-pages
          git rm -r --ignore-unmatch .
          cp -R "$publish_dir"/. .
          git add -A
          git commit -m "Deploy ${GITHUB_SHA}" || exit 0
          git push origin gh-pages
